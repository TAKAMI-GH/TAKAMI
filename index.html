<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asistente KAMI-AI - TAKAMI</title>
  <style>
    /* ======================================================
       1. VARIABLES DE DISEÑO Y MARCA TAKAMI
       ====================================================== */
    :root {
      --primary-color: #232323;       /* Tono carbón corporativo, más suave que el negro puro */
      --accent-color: #c5a059;        /* Color dorado TAKAMI */
      --bg-chat: #ffffff;             /* Fondo interior del chat más limpio */
      --page-bg: linear-gradient(135deg, #f0f2f5 0%, #e1e4e8 100%); /* Fondo de página cálido y moderno */
      --text-dark: #2d3748;           /* Texto general amigable a la vista */
      --bot-msg-bg: #f3f4f6;          /* Fondo del mensaje de la IA - gris muy suave */
      --bot-msg-text: #374151;        /* Texto mensaje IA - gris oscuro */
      --user-msg-bg: #232323;         /* Fondo del mensaje del usuario */
      --user-msg-text: #ffffff;       /* Texto del usuario */
      --font-family: 'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }
    
    body { 
      background: var(--page-bg);
      font-family: var(--font-family);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      color: var(--text-dark);
    }

    /* Contenedor Principal del Chat */
    .chat-container {
      width: 100%;
      max-width: 420px; /* Un poco más estilizado */
      height: 650px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.08); /* Sombra más suave y expansiva */
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Encabezado con Logo de TAKAMI */
    .chat-header {
      background-color: var(--primary-color);
      color: #ffffff;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      border-bottom: 3px solid var(--accent-color); /* Línea dorada más pronunciada */
    }

    .chat-header img {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      background-color: #ffffff;
      padding: 3px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .header-info h3 { 
      font-size: 18px; 
      font-weight: 600; 
      margin: 0 0 4px 0;
      letter-spacing: 0.5px;
    }
    
    .header-info p { 
      font-size: 13px; 
      opacity: 0.9; 
      margin: 0;
      display: flex; 
      align-items: center; 
      gap: 6px; 
    }
    
    .status-dot { 
      width: 8px; 
      height: 8px; 
      background-color: #4ade80; /* Verde más moderno y brillante */
      border-radius: 50%; 
      display: inline-block; 
      box-shadow: 0 0 8px rgba(74, 222, 128, 0.4);
    }

    /* Área de Mensajes */
    .chat-messages {
      flex: 1;
      padding: 24px 20px;
      background-color: var(--bg-chat);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Scrollbar estilizado */
    .chat-messages::-webkit-scrollbar { width: 6px; }
    .chat-messages::-webkit-scrollbar-track { background: transparent; }
    .chat-messages::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }

    .message {
      max-width: 85%;
      padding: 14px 18px;
      font-size: 14.5px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
      animation: fadeIn 0.3s ease-out;
      box-shadow: 0 2px 5px rgba(0,0,0,0.02);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Burbujas de chat más redondeadas y conversacionales */
    .message.bot {
      align-self: flex-start;
      background-color: var(--bot-msg-bg);
      color: var(--bot-msg-text);
      border-radius: 18px 18px 18px 4px;
    }

    .message.user {
      align-self: flex-end;
      background-color: var(--user-msg-bg);
      color: var(--user-msg-text);
      border-radius: 18px 18px 4px 18px;
    }

    /* Indicador de "Escribiendo..." */
    .typing-indicator {
      align-self: flex-start;
      background-color: var(--bot-msg-bg);
      padding: 14px 18px;
      border-radius: 18px 18px 18px 4px;
      display: none;
      gap: 5px;
      align-items: center;
    }

    .typing-indicator span {
      width: 6px; 
      height: 6px; 
      background-color: #9ca3af; 
      border-radius: 50%;
      animation: blink 1.4s infinite ease-in-out both;
    }
    .typing-indicator span:nth-child(1) { animation-delay: 0s; }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0.4; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1.2); }
    }

    /* Área de Entrada de Texto */
    .chat-input-area {
      padding: 16px 20px;
      background-color: #ffffff;
      border-top: 1px solid #f1f5f9;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .chat-input-area input {
      flex: 1;
      padding: 14px 20px;
      border: 1px solid #e2e8f0;
      border-radius: 30px;
      outline: none;
      font-size: 14.5px;
      transition: all 0.2s ease;
      background-color: #f8fafc;
    }

    .chat-input-area input:focus { 
      border-color: var(--accent-color);
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(197, 160, 89, 0.1);
    }

    .chat-input-area button {
      background-color: var(--accent-color); /* Botón en dorado corporativo */
      color: #ffffff;
      border: none;
      padding: 14px 24px;
      border-radius: 30px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14.5px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(197, 160, 89, 0.3);
    }

    .chat-input-area button:hover { 
      background-color: #b38e4a; 
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(197, 160, 89, 0.4);
    }
    
    .chat-input-area button:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <!-- Encabezado con Marca y Logo -->
    <div class="chat-header">
      <img id="takami-logo" src="LogoReducidoN.png" alt="Takami Logo">
      <div class="header-info">
        <h3>Asistente KAMI-AI</h3>
        <p><span class="status-dot"></span> En línea para ayudarte</p>
      </div>
    </div>

    <!-- Mensajes -->
    <div class="chat-messages" id="chat-messages">
      <div class="message bot">¡Hola! Qué gusto saludarte. Soy el asistente de colaboradores de Takami. ¿En qué te puedo apoyar el día de hoy?</div>
    </div>

    <!-- Indicador de Carga -->
    <div class="typing-indicator" id="typing-indicator">
      <span></span><span></span><span></span>
    </div>

    <!-- Campo de Texto -->
    <div class="chat-input-area">
      <input type="text" id="user-input" placeholder="Escribe tu consulta aquí..." onkeypress="handleKeyPress(event)">
      <button onclick="sendMessage()">Enviar</button>
    </div>
  </div>

  <script>
   /* ======================================================
     1. CONFIGURACIÓN DEL WEBHOOK Y TIEMPO DE SESIÓN
     ====================================================== */
  const N8N_WEBHOOK_URL = "https://takami-analitica.app.n8n.cloud/webhook/fc87dbcb-6724-4852-8f66-b1c03233fdb3/chat";
  
  // Tiempo de inactividad antes de renovar la sesión (15 minutos)
  const MINUTOS_INACTIVIDAD = 15; 
  const TIEMPO_LIMITE_MS = MINUTOS_INACTIVIDAD * 60 * 1000; 

  /* ======================================================
     2. LÓGICA DE GESTIÓN DE SESIÓN
     ====================================================== */
  function obtenerOcrearSessionId() {
    const ahora = Date.now();
    const ultimaActividad = localStorage.getItem("takami_last_activity");
    let sessionId = localStorage.getItem("takami_chat_session");

    if (!sessionId || !ultimaActividad || (ahora - parseInt(ultimaActividad)) > TIEMPO_LIMITE_MS) {
      sessionId = "takami_colab_" + Date.now() + "_" + Math.random().toString(36).substring(2, 7);
      localStorage.setItem("takami_chat_session", sessionId);
      console.log("Sesión anterior expirada. Nueva sesión iniciada:", sessionId);
    }

    localStorage.setItem("takami_last_activity", ahora.toString());
    return sessionId;
  }

  const messagesContainer = document.getElementById("chat-messages");
  const userInput = document.getElementById("user-input");
  const typingIndicator = document.getElementById("typing-indicator");

  function appendMessage(sender, text) {
    const msgDiv = document.createElement("div");
    msgDiv.classList.add("message", sender);
    msgDiv.textContent = text;
    messagesContainer.appendChild(msgDiv);
    
    // Suave animación de scroll al nuevo mensaje
    messagesContainer.scrollTo({
      top: messagesContainer.scrollHeight,
      behavior: 'smooth'
    });
  }

  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;

    const currentSessionId = obtenerOcrearSessionId();

    appendMessage("user", text);
    userInput.value = "";
    
    // Mostrar indicador de escritura
    messagesContainer.appendChild(typingIndicator);
    typingIndicator.style.display = "flex";
    messagesContainer.scrollTo({ top: messagesContainer.scrollHeight, behavior: 'smooth' });

    try {
      const response = await fetch(N8N_WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action: "sendMessage",
          sessionId: currentSessionId,
          chatInput: text
        })
      });

      const data = await response.json();
      typingIndicator.style.display = "none";

      let botResponse = "Lo siento, no pude procesar tu solicitud en este momento.";
      if (Array.isArray(data) && data[0]?.output) {
        botResponse = data[0].output;
      } else if (data.output) {
        botResponse = data.output;
      }

      appendMessage("bot", botResponse);
      localStorage.setItem("takami_last_activity", Date.now().toString());

    } catch (error) {
      console.error("Error al conectar con n8n:", error);
      typingIndicator.style.display = "none";
      appendMessage("bot", "Ocurrió un error de conexión con el servidor. Por favor intenta de nuevo en unos minutos.");
    }
  }

  function handleKeyPress(event) {
    if (event.key === "Enter") {
      sendMessage();
    }
  }
  </script>
</body>
</html>
